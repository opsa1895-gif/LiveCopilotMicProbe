name: Validate v0.60 semantic turn-end gating

on:
  push:
    branches: [v0-60-final-turn-replies]
    paths:
      - .github/workflows/v0-60-semantic-turn-end.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0-60-final-turn-replies
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Apply semantic turn-end refinement
        run: python3 .ci/apply_v060_semantic_turn_end.py

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Remove validation helpers
        run: rm .ci/apply_v060_semantic_turn_end.py .github/workflows/v0-60-semantic-turn-end.yml

      - name: Commit refinement
        run: |
          git config user.name "opsa1895-gif"
          git config user.email "opsa1895@gmail.com"
          git add app .ci .github/workflows/v0-60-semantic-turn-end.yml
          git commit -m "Gate file semantic replies on complete speech turns"
          git push origin HEAD:v0-60-final-turn-replies
