name: Apply v0.47 new speech invalidation

on:
  push:
    branches:
      - copilot-v0-47-new-speech-invalidation
    paths:
      - .github/scripts/apply_v047.py
      - .github/workflows/apply-v047-new-speech-invalidation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-47-new-speech-invalidation
      - name: Apply guarded source patch
        run: python .github/scripts/apply_v047.py
      - name: Commit patched sources
        run: |
          git config user.name "opsa1895-gif"
          git config user.email "opsa1895@gmail.com"
          git add app/build.gradle.kts app/src/main/java/com/livecopilot/micprobe/OpenAiCopilotClient.java app/src/main/java/com/livecopilot/micprobe/MicProbeAccessibilityService.java
          git diff --cached --quiet && exit 1
          git commit -m "fix: invalidate stale replies on new speech"
          git push origin HEAD:copilot-v0-47-new-speech-invalidation
