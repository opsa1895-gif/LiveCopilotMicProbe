name: Apply v0.53 status semantic freshness

on:
  push:
    branches:
      - v0-53-status-semantic-freshness
    paths:
      - .github/workflows/v0-53-status-semantic-freshness.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0-53-status-semantic-freshness

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Patch status and semantic freshness
        run: python3 .github/v0_53_patch.py

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts
          git add app/src/main/java/com/livecopilot/micprobe/OpenAiCopilotClient.java
          git add app/src/main/java/com/livecopilot/micprobe/MicProbeAccessibilityService.java
          git add app/src/main/java/com/livecopilot/micprobe/SemanticEpochPolicy.java
          git add app/src/test/java/com/livecopilot/micprobe/SemanticEpochPolicyTest.java
          git rm .github/v0_53_patch.py
          git rm .github/workflows/v0-53-status-semantic-freshness.yml
          git commit -m 'fix: keep status and semantic callbacks latest-only'
          git push origin HEAD:v0-53-status-semantic-freshness
