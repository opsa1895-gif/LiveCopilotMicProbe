name: Apply v0.55 atomic reply state fix

on:
  push:
    branches: [v0-55-atomic-reply-state]
    paths:
      - .github/workflows/v0-55-atomic-reply-state-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0-55-atomic-reply-state
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Apply v0.55 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/v0-55-atomic-reply-state.yml').read_text().splitlines()
          capture = False
          script = []
          for line in workflow:
              if line.strip() == "python3 - <<'PY'":
                  capture = True
                  continue
              if capture and line.strip() == 'PY':
                  break
              if capture:
                  script.append(line[10:] if line.startswith('          ') else line)
          if not script:
              raise SystemExit('could not extract v0.55 patch script')
          exec(compile('\n'.join(script), 'v0.55-patch', 'exec'))
          PY

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Remove validation workflows
        run: rm .github/workflows/v0-55-atomic-reply-state.yml .github/workflows/v0-55-atomic-reply-state-fix.yml

      - name: Commit patch
        run: |
          git config user.name "opsa1895-gif"
          git config user.email "opsa1895@gmail.com"
          git add app .github/workflows/v0-55-atomic-reply-state.yml .github/workflows/v0-55-atomic-reply-state-fix.yml
          git commit -m "Live Copilot v0.55 atomic reply state freshness"
          git push origin HEAD:v0-55-atomic-reply-state
