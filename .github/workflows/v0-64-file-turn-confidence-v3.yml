name: Validate v0.64 file turn confidence v3

on:
  push:
    branches:
      - v0-64-file-turn-confidence
    paths:
      - .github/workflows/v0-64-file-turn-confidence-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: v0-64-file-turn-confidence
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          cache-read-only: true

      - name: Repair validation helpers
        run: |
          python3 .github/scripts/v064_prepare.py
          python3 .github/scripts/v064_prepare2.py

      - name: Apply v0.64 source patch
        run: python3 .github/scripts/v064_patch.py

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Remove validation helpers
        run: |
          rm -f .github/scripts/v064_patch.py \
                .github/scripts/v064_prepare.py \
                .github/scripts/v064_prepare2.py \
                .github/workflows/v0-64-file-turn-confidence.yml \
                .github/workflows/v0-64-file-turn-confidence-v2.yml \
                .github/workflows/v0-64-file-turn-confidence-v3.yml

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
                  app/src/main/java/com/livecopilot/micprobe/OpenAiCopilotClient.java \
                  app/src/main/java/com/livecopilot/micprobe/SemanticReplyFallback.java \
                  app/src/main/java/com/livecopilot/micprobe/MicProbeAccessibilityService.java \
                  app/src/main/java/com/livecopilot/micprobe/FileTurnCoveragePolicy.java \
                  app/src/test/java/com/livecopilot/micprobe/FileTurnCoveragePolicyTest.java \
                  .github/scripts/v064_patch.py \
                  .github/scripts/v064_prepare.py \
                  .github/scripts/v064_prepare2.py \
                  .github/workflows/v0-64-file-turn-confidence.yml \
                  .github/workflows/v0-64-file-turn-confidence-v2.yml \
                  .github/workflows/v0-64-file-turn-confidence-v3.yml
          git status --short
          git commit -m "Live Copilot v0.64 gate replies by file turn confidence" || exit 1
          git push origin HEAD:v0-64-file-turn-confidence
