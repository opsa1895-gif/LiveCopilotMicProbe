name: Validate v0.88 regime release outcomes

on:
  push:
    branches: [ v0-88-regime-release-outcomes ]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: v0-88-regime-release-outcomes

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Apply v0.88 patch
        run: python3 scripts/apply_v0_88.py

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
            app/src/main/java/com/livecopilot/micprobe/RealtimeRoutingPolicy.java \
            app/src/main/java/com/livecopilot/micprobe/RealtimeTranscriptionClient.java \
            app/src/test/java/com/livecopilot/micprobe/RealtimeRoutingRegimeReleaseOutcomePolicyTest.java
          git commit -m "Observe outcomes after latency regime releases"
          git push origin HEAD:v0-88-regime-release-outcomes
