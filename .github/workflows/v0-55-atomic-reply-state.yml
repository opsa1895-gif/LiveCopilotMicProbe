name: Apply v0.55 atomic reply state

on:
  push:
    branches: [v0-55-atomic-reply-state]
    paths:
      - .github/workflows/v0-55-atomic-reply-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0-55-atomic-reply-state
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Patch atomic reply state freshness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('app/src/main/java/com/livecopilot/micprobe/OpenAiCopilotClient.java')
          source = source_path.read_text()

          replacements = [
              (
                  '''            synchronized (this) {\n                lastDirectReply = primary;\n                lastSarcasticReply = "";\n                lastFunnyReply = "";\n                lastCalmReply = "";\n                lastReplyAtMs = System.currentTimeMillis();\n            }''',
                  '''            synchronized (this) {\n                if (!currentLocked(job)) return;\n                lastDirectReply = primary;\n                lastSarcasticReply = "";\n                lastFunnyReply = "";\n                lastCalmReply = "";\n                lastReplyAtMs = System.currentTimeMillis();\n            }'''
              ),
              (
                  '''            synchronized (this) {\n                lastDirectReply = direct;\n                lastSarcasticReply = local.sarcastic;\n                lastFunnyReply = local.funny;\n                lastCalmReply = local.calm;\n                lastReplyAtMs = System.currentTimeMillis();\n            }''',
                  '''            synchronized (this) {\n                if (!currentLocked(job)) return;\n                lastDirectReply = direct;\n                lastSarcasticReply = local.sarcastic;\n                lastFunnyReply = local.funny;\n                lastCalmReply = local.calm;\n                lastReplyAtMs = System.currentTimeMillis();\n            }'''
              ),
              (
                  '''            synchronized (this) {\n                if (!complete.direct.isEmpty()) lastDirectReply = complete.direct;\n                lastSarcasticReply = complete.sarcastic;\n                lastFunnyReply = complete.funny;\n                lastCalmReply = complete.calm;\n            }''',
                  '''            synchronized (this) {\n                if (!currentLocked(job)) return;\n                if (!complete.direct.isEmpty()) lastDirectReply = complete.direct;\n                lastSarcasticReply = complete.sarcastic;\n                lastFunnyReply = complete.funny;\n                lastCalmReply = complete.calm;\n            }'''
              ),
              (
                  '''            synchronized (this) {\n                lastSarcasticReply = local.sarcastic;\n                lastFunnyReply = local.funny;\n                lastCalmReply = local.calm;\n            }''',
                  '''            synchronized (this) {\n                if (!currentLocked(job)) return;\n                lastSarcasticReply = local.sarcastic;\n                lastFunnyReply = local.funny;\n                lastCalmReply = local.calm;\n            }'''
              ),
              (
                  '''    private synchronized boolean current(ReplyJob job) {\n        return !closed\n                && job.sessionSerial == sessionSerial\n                && job.serial == latestReplySerial\n                && System.currentTimeMillis() - job.createdAtMs <= MAX_REPLY_AGE_MS;\n    }''',
                  '''    private synchronized boolean current(ReplyJob job) {\n        return currentLocked(job);\n    }\n\n    // Must be called while holding this monitor. Keeping the freshness check in the\n    // same critical section as state writes closes the final check-then-write race.\n    private boolean currentLocked(ReplyJob job) {\n        long ageMs = Math.max(0L, System.currentTimeMillis() - job.createdAtMs);\n        return ReplyStateFreshnessPolicy.shouldApply(\n                job.sessionSerial, sessionSerial, job.serial, latestReplySerial,\n                ageMs, MAX_REPLY_AGE_MS, closed);\n    }'''
              ),
              (
                  '''        String nextSummary = clean(json.optString("summary", ""));\n        if (!nextSummary.isEmpty()) {\n            synchronized (this) { summary = shorten(nextSummary, 420); }\n        }''',
                  '''        String nextSummary = clean(json.optString("summary", ""));\n        if (!nextSummary.isEmpty()) {\n            synchronized (this) {\n                if (currentLocked(job)) summary = shorten(nextSummary, 420);\n            }\n        }'''
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one source match, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          source_path.write_text(source)

          Path('app/src/main/java/com/livecopilot/micprobe/ReplyStateFreshnessPolicy.java').write_text('''package com.livecopilot.micprobe;\n\nfinal class ReplyStateFreshnessPolicy {\n    private ReplyStateFreshnessPolicy() {}\n\n    static boolean shouldApply(long jobSessionSerial,\n                               long currentSessionSerial,\n                               long jobSerial,\n                               long currentSerial,\n                               long ageMs,\n                               long maxAgeMs,\n                               boolean closed) {\n        return AsyncCallbackFreshnessPolicy.shouldAccept(\n                jobSessionSerial, currentSessionSerial, jobSerial, currentSerial, closed)\n                && ageMs >= 0L\n                && ageMs <= maxAgeMs;\n    }\n}\n''')

          Path('app/src/test/java/com/livecopilot/micprobe/ReplyStateFreshnessPolicyTest.java').write_text('''package com.livecopilot.micprobe;\n\nimport org.junit.Test;\n\nimport static org.junit.Assert.assertFalse;\nimport static org.junit.Assert.assertTrue;\n\npublic class ReplyStateFreshnessPolicyTest {\n    @Test\n    public void currentReplyCanApplyState() {\n        assertTrue(ReplyStateFreshnessPolicy.shouldApply(3L, 3L, 8L, 8L, 500L, 12_000L, false));\n    }\n\n    @Test\n    public void supersededReplyCannotApplyState() {\n        assertFalse(ReplyStateFreshnessPolicy.shouldApply(3L, 3L, 7L, 8L, 500L, 12_000L, false));\n    }\n\n    @Test\n    public void previousSessionCannotApplyState() {\n        assertFalse(ReplyStateFreshnessPolicy.shouldApply(2L, 3L, 8L, 8L, 500L, 12_000L, false));\n    }\n\n    @Test\n    public void expiredOrClosedReplyCannotApplyState() {\n        assertFalse(ReplyStateFreshnessPolicy.shouldApply(3L, 3L, 8L, 8L, 12_001L, 12_000L, false));\n        assertFalse(ReplyStateFreshnessPolicy.shouldApply(3L, 3L, 8L, 8L, 500L, 12_000L, true));\n    }\n}\n''')

          gradle_path = Path('app/build.gradle.kts')
          gradle = gradle_path.read_text()
          old_version = '''        versionCode = 55\n        versionName = "0.54.0-cancel-stale-http"'''
          new_version = '''        versionCode = 56\n        versionName = "0.55.0-atomic-reply-state"'''
          if gradle.count(old_version) != 1:
              raise SystemExit('unexpected app version block')
          gradle_path.write_text(gradle.replace(old_version, new_version, 1))
          PY

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Remove validation workflow
        run: rm .github/workflows/v0-55-atomic-reply-state.yml

      - name: Commit patch
        run: |
          git config user.name "opsa1895-gif"
          git config user.email "opsa1895@gmail.com"
          git add app .github/workflows/v0-55-atomic-reply-state.yml
          git commit -m "Live Copilot v0.55 atomic reply state freshness"
          git push origin HEAD:v0-55-atomic-reply-state
