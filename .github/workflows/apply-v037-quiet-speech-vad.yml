name: Apply v0.37 quiet speech VAD

on:
  push:
    branches: [copilot-v0-37-quiet-speech-vad]
    paths:
      - .github/workflows/apply-v037-quiet-speech-vad.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-37-quiet-speech-vad
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python .github/scripts/apply_v037.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/livecopilot/micprobe/VoiceActivityPolicy.java app/src/main/java/com/livecopilot/micprobe/MicProbeEngine.java app/src/test/java/com/livecopilot/micprobe/VoiceActivityPolicyTest.java app/build.gradle.kts
          git diff --cached --check
          git commit -m "v0.37: detect sustained quiet speech [v037-applied]"
          git push origin HEAD:copilot-v0-37-quiet-speech-vad
