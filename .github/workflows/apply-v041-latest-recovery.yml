name: Apply v0.41 latest recovery

on:
  push:
    branches: [copilot-v0-41-latest-recovery]
    paths:
      - .github/workflows/apply-v041-latest-recovery.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-41-latest-recovery
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python .github/scripts/apply_v041.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/livecopilot/micprobe/RealtimeTranscriptionClient.java app/src/main/java/com/livecopilot/micprobe/MicProbeAccessibilityService.java app/src/main/java/com/livecopilot/micprobe/RealtimeRecoveryPolicy.java app/src/test/java/com/livecopilot/micprobe/RealtimeRecoveryPolicyTest.java app/build.gradle.kts
          git diff --cached --check
          git commit -m "v0.41: keep realtime recovery latest and fresh [v041-applied]"
          git push origin HEAD:copilot-v0-41-latest-recovery
