name: Apply v0.29 host style parity

on:
  push:
    branches: [copilot-v0-29-host-style-parity]
    paths:
      - .github/workflows/apply-v029-host-style-parity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-29-host-style-parity
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python .github/scripts/apply_v029.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/livecopilot/micprobe/SemanticReplyFallback.java app/build.gradle.kts
          git diff --cached --check
          git commit -m "v0.29: align realtime replies with host style [v029-applied]"
          git push origin HEAD:copilot-v0-29-host-style-parity
