name: Apply v0.43 shared reply context

on:
  push:
    branches: [copilot-v0-43-shared-reply-context]
    paths:
      - .github/workflows/apply-v043-shared-reply-context.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-43-shared-reply-context
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python .github/scripts/apply_v043.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/livecopilot/micprobe/OpenAiCopilotClient.java app/src/main/java/com/livecopilot/micprobe/MicProbeAccessibilityService.java app/build.gradle.kts
          git diff --cached --check
          git commit -m "v0.43: share reply context across realtime and file lanes [v043-applied]"
          git push origin HEAD:copilot-v0-43-shared-reply-context
