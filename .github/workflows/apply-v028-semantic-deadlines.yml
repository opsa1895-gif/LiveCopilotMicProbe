name: Apply v0.28 semantic deadlines

on:
  push:
    branches: [copilot-v0-28-semantic-deadlines]
    paths:
      - .github/workflows/apply-v028-semantic-deadlines.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-28-semantic-deadlines
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python .github/scripts/apply_v028.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/livecopilot/micprobe/SemanticReplyFallback.java app/build.gradle.kts
          git diff --cached --check
          git commit -m "v0.28: bound semantic network latency [v028-applied]"
          git push origin HEAD:copilot-v0-28-semantic-deadlines
