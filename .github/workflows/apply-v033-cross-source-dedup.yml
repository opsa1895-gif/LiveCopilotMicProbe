name: Apply v0.33 cross-source dedup

on:
  push:
    branches: [copilot-v0-33-cross-source-dedup]
    paths:
      - .github/workflows/apply-v033-cross-source-dedup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-33-cross-source-dedup
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python .github/scripts/apply_v033.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/livecopilot/micprobe/MicProbeAccessibilityService.java app/build.gradle.kts
          git diff --cached --check
          git commit -m "v0.33: dedup realtime and file transcripts [v033-applied]"
          git push origin HEAD:copilot-v0-33-cross-source-dedup
