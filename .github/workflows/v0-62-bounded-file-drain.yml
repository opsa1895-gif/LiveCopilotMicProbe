name: Validate v0.62 bounded file drain

on:
  push:
    branches:
      - v0-62-bounded-file-drain
    paths:
      - .github/workflows/v0-62-bounded-file-drain.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v0-62-bounded-file-drain
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          cache-read-only: true

      - name: Apply v0.62 source patch
        run: python3 .github/scripts/v062_patch.py

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Remove validation helpers
        run: rm -f .github/scripts/v062_patch.py .github/workflows/v0-62-bounded-file-drain.yml

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/livecopilot/micprobe/OpenAiCopilotClient.java \
                  .github/scripts/v062_patch.py \
                  .github/workflows/v0-62-bounded-file-drain.yml
          git status --short
          git commit -m "Live Copilot v0.62 bound file STT drain"
          git push origin HEAD:v0-62-bounded-file-drain
