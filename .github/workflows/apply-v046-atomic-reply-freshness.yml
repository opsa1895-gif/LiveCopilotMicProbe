name: Apply v0.46 atomic reply freshness

on:
  push:
    branches:
      - copilot-v0-46-atomic-reply-freshness
    paths:
      - .github/scripts/apply_v046.py
      - .github/workflows/apply-v046-atomic-reply-freshness.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-46-atomic-reply-freshness
      - name: Apply guarded source patch
        run: python .github/scripts/apply_v046.py
      - name: Commit patched sources
        run: |
          git config user.name "opsa1895-gif"
          git config user.email "opsa1895@gmail.com"
          git add app/build.gradle.kts app/src/main/java/com/livecopilot/micprobe/OpenAiCopilotClient.java app/src/test/java/com/livecopilot/micprobe/FileSttFreshnessPolicyTest.java
          git diff --cached --quiet && exit 1
          git commit -m "fix: make file reply freshness atomic"
          git push origin HEAD:copilot-v0-46-atomic-reply-freshness
