name: Apply v0.31 actionable prefixes

on:
  push:
    branches: [copilot-v0-31-actionable-prefixes]
    paths:
      - .github/workflows/apply-v031-actionable-prefixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-31-actionable-prefixes
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python .github/scripts/apply_v031.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/livecopilot/micprobe/OpenAiCopilotClient.java app/build.gradle.kts
          git diff --cached --check
          git commit -m "v0.31: detect questions after conversational prefixes [v031-applied]"
          git push origin HEAD:copilot-v0-31-actionable-prefixes
