name: Clean v0.58 formatting

on:
  push:
    branches: [v0-58-latest-file-stt-queue]
    paths:
      - .github/workflows/v0-58-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0-58-latest-file-stt-queue
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Clean formatting
        run: |
          perl -0pi -e 's/latestReplySerial\+\+;\n                \}\n        audioHttp/latestReplySerial++;\n        }\n        audioHttp/' app/src/main/java/com/livecopilot/micprobe/OpenAiCopilotClient.java
          perl -0pi -e 's/    \}\n\n\n    \@Test/    }\n\n    \@Test/' app/src/test/java/com/livecopilot/micprobe/LatestWinsExecutorTest.java

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Remove cleanup workflow
        run: rm .github/workflows/v0-58-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name "opsa1895-gif"
          git config user.email "opsa1895@gmail.com"
          git add app .github/workflows/v0-58-cleanup.yml
          git commit -m "style: clean v0.58 queue patch formatting"
          git push origin HEAD:v0-58-latest-file-stt-queue
