name: Validate v0.61 parallel file STT

on:
  push:
    branches: [v0-61-parallel-file-stt]
    paths:
      - '.github/workflows/v0-61-parallel-file-stt.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0-61-parallel-file-stt
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Apply v0.61 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(text, old, new, count=1):
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'expected {count} occurrences, found {actual}: {old[:90]!r}')
              return text.replace(old, new)

          p = Path('app/src/main/java/com/livecopilot/micprobe/OpenAiCopilotClient.java')
          s = p.read_text()
          s = replace_exact(s,
              '        void onFileTurnComplete(long sessionSerial, long inputSerial, String turnFocus, boolean mainReplyQueued);',
              '        void onFileTurnComplete(long sessionSerial, long inputSerial, String turnFocus, boolean mainReplyQueued, long drainLatencyMs);')
          s = replace_exact(s,
              '    private final ExecutorService audioExecutor = Executors.newSingleThreadExecutor();',
              '    private final OrderedParallelExecutor<String> audioExecutor = new OrderedParallelExecutor<>(2);')
          s = replace_exact(s,
              '        fileTurnFocus = "";\n        audioHttp.cancelAll();',
              '        fileTurnFocus = "";\n        audioExecutor.cancelPending();\n        audioHttp.cancelAll();',
              4)
          s = replace_exact(s,
              '        AudioItem item = new AudioItem(samples.clone(), sampleRate, sessionSerial, inputSerial);\n        audioExecutor.execute(() -> processAudioIfFresh(item));',
              '        AudioItem item = new AudioItem(samples.clone(), sampleRate, sessionSerial, inputSerial);\n        audioExecutor.submit(\n                () -> transcribeAudioIfFresh(item),\n                (raw, error) -> processAudioResult(item, raw, error));')
          s = replace_exact(s,
              '        audioExecutor.execute(() -> finishAudioTurnIfFresh(end));',
              '        audioExecutor.afterSubmitted(() -> finishAudioTurnIfFresh(end));')

          start = s.index('    private void processAudioIfFresh(AudioItem item) {')
          end = s.index('    private void finishAudioTurnIfFresh(TurnEndItem end) {')
          replacement = '''    private String transcribeAudioIfFresh(AudioItem item) throws Exception {
              if (item == null || !shouldProcessAudioResult(item)) return null;
              String key = SecretStore.loadApiKey(context);
              if (key.isEmpty()) {
                  listener.onStatus(item.sessionSerial, item.inputSerial, false, "Няма API key");
                  return null;
              }
              listener.onStatus(item.sessionSerial, item.inputSerial, false, "Разпознавам…");
              return transcribe(key, item);
          }

          private void processAudioResult(AudioItem item, String raw, Throwable error) {
              if (item == null || !shouldProcessAudioResult(item)) return;
              if (error != null) {
                  if (shouldSurfaceAudioResult(item)) {
                      listener.onStatus(item.sessionSerial, item.inputSerial, false, "AI връзката прекъсна");
                  }
                  return;
              }
              if (raw == null) return;
              if (TranscriptQualityPolicy.isLowQuality(raw)) {
                  listener.onStatus(item.sessionSerial, item.inputSerial, false, "Слушам");
                  return;
              }

              long now = System.currentTimeMillis();
              String focus;
              synchronized (this) {
                  // Network STT may finish out of order, but OrderedParallelExecutor
                  // commits results in submission order before touching conversation state.
                  if (!isProcessableAudioResultLocked(item)) {
                      focus = "";
                  } else {
                      String useful = removeRecentSelfEcho(raw, now);
                      if (useful.isEmpty()) {
                          focus = "";
                      } else {
                          boolean topicShift = isStrongTopicShift(useful);
                          prepareContextFor(useful, now);
                          focus = commitTranscript(useful, now);
                          if (!focus.isEmpty()) {
                              if (fileTurnSerial != item.inputSerial) {
                                  fileTurnSerial = item.inputSerial;
                                  fileTurnFocus = "";
                              }
                              fileTurnFocus = FileTurnReplyPolicy.appendFocus(
                                      fileTurnFocus, focus, topicShift);
                              if (firstSpeechAtMs == 0L) firstSpeechAtMs = now;
                          }
                      }
                  }
              }
              if (focus.isEmpty()) {
                  listener.onStatus(item.sessionSerial, item.inputSerial, false, "Слушам");
                  return;
              }
              if (!shouldSurfaceAudioResult(item)) {
                  listener.onStatus(item.sessionSerial, item.inputSerial, false, "Слушам");
                  return;
              }
              listener.onTranscript(item.sessionSerial, item.inputSerial, focus);
              listener.onStatus(item.sessionSerial, item.inputSerial, false, "Слушам");
          }

'''
          s = s[:start] + replacement + s[end:]
          s = replace_exact(s,
              '        listener.onFileTurnComplete(\n                end.sessionSerial, end.inputSerial, turnFocus, mainReplyQueued);',
              '        long drainLatencyMs = Math.max(0L, now - end.createdAtMs);\n        listener.onFileTurnComplete(\n                end.sessionSerial, end.inputSerial, turnFocus, mainReplyQueued, drainLatencyMs);')
          p.write_text(s)

          p = Path('app/src/main/java/com/livecopilot/micprobe/MicProbeAccessibilityService.java')
          s = p.read_text()
          s = replace_exact(s,
              '    private long lastSemanticLatencyMs = -1L;',
              '    private long lastSemanticLatencyMs = -1L;\n    private long lastFileDrainLatencyMs = -1L;')
          s = replace_exact(s,
              '    public void onFileTurnComplete(\n            long sessionSerial, long inputSerial, String turnFocus, boolean mainReplyQueued) {\n        getMainExecutor().execute(() -> handleFileTurnComplete(\n                sessionSerial, inputSerial, turnFocus, mainReplyQueued));\n    }\n\n    private synchronized void handleFileTurnComplete(\n            long sessionSerial, long inputSerial, String turnFocus, boolean mainReplyQueued) {',
              '    public void onFileTurnComplete(\n            long sessionSerial, long inputSerial, String turnFocus, boolean mainReplyQueued,\n            long drainLatencyMs) {\n        getMainExecutor().execute(() -> handleFileTurnComplete(\n                sessionSerial, inputSerial, turnFocus, mainReplyQueued, drainLatencyMs));\n    }\n\n    private synchronized void handleFileTurnComplete(\n            long sessionSerial, long inputSerial, String turnFocus, boolean mainReplyQueued,\n            long drainLatencyMs) {')
          s = replace_exact(s,
              '        if (engine == null || !engine.isRunning()) return;\n\n        if (!FileTurnReplyPolicy.shouldUseSemanticFallback(mainReplyQueued, turnFocus)) {',
              '        if (engine == null || !engine.isRunning()) return;\n        lastFileDrainLatencyMs = Math.max(0L, drainLatencyMs);\n        renderDebug();\n\n        if (!FileTurnReplyPolicy.shouldUseSemanticFallback(mainReplyQueued, turnFocus)) {')
          s = replace_exact(s,
              '                + " • sem " + latencyLabel(lastSemanticLatencyMs);',
              '                + " • sem " + latencyLabel(lastSemanticLatencyMs)\n                + " • file-drain " + latencyLabel(lastFileDrainLatencyMs);')
          s = replace_exact(s,
              '        lastSemanticLatencyMs = -1L;',
              '        lastSemanticLatencyMs = -1L;\n        lastFileDrainLatencyMs = -1L;',
              1)
          p.write_text(s)

          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = replace_exact(s, 'versionCode = 61', 'versionCode = 62')
          s = replace_exact(s, 'versionName = "0.60.0-final-turn-replies"',
                            'versionName = "0.61.0-parallel-file-stt"')
          p.write_text(s)
          PY
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Remove validation helper
        run: rm -f .github/workflows/v0-61-parallel-file-stt.yml
      - name: Commit patch
        run: |
          git config user.name "opsa1895-gif"
          git config user.email "opsa1895@gmail.com"
          git add app/build.gradle.kts \
            app/src/main/java/com/livecopilot/micprobe/OpenAiCopilotClient.java \
            app/src/main/java/com/livecopilot/micprobe/MicProbeAccessibilityService.java \
            app/src/main/java/com/livecopilot/micprobe/OrderedParallelExecutor.java \
            app/src/test/java/com/livecopilot/micprobe/OrderedParallelExecutorTest.java \
            .github/workflows/v0-61-parallel-file-stt.yml
          git commit -m "Live Copilot v0.61 parallelize file STT"
          git push origin HEAD:v0-61-parallel-file-stt
