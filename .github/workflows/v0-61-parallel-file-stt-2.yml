name: Validate v0.61 parallel file STT v2

on:
  push:
    branches: [v0-61-parallel-file-stt]
    paths:
      - '.github/workflows/v0-61-parallel-file-stt-2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0-61-parallel-file-stt
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Apply v0.61 patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Remove validation helpers
        run: rm -f .github/workflows/v0-61-parallel-file-stt.yml .github/workflows/v0-61-parallel-file-stt-2.yml
      - name: Commit patch
        run: |
          git config user.name "opsa1895-gif"
          git config user.email "opsa1895@gmail.com"
          git add app/build.gradle.kts app/src/main/java/com/livecopilot/micprobe/OpenAiCopilotClient.java app/src/main/java/com/livecopilot/micprobe/MicProbeAccessibilityService.java app/src/main/java/com/livecopilot/micprobe/OrderedParallelExecutor.java app/src/test/java/com/livecopilot/micprobe/OrderedParallelExecutorTest.java .github/workflows/v0-61-parallel-file-stt.yml .github/workflows/v0-61-parallel-file-stt-2.yml
          git commit -m "Live Copilot v0.61 parallelize file STT"
          git push origin HEAD:v0-61-parallel-file-stt
