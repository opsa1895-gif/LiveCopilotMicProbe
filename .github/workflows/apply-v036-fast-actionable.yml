name: Apply v0.36 fast actionable

on:
  push:
    branches: [copilot-v0-36-fast-direct]
    paths:
      - .github/workflows/apply-v036-fast-actionable.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-36-fast-direct
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python .github/scripts/apply_v036.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/livecopilot/micprobe/MicProbeAccessibilityService.java app/build.gradle.kts
          git diff --cached --check
          git commit -m "v0.36: fast scheduling for actionable speech [v036-applied]"
          git push origin HEAD:copilot-v0-36-fast-direct
