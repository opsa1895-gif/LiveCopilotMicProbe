name: Apply v0.49 clear send recovery

on:
  push:
    branches:
      - copilot-v0-49-clear-send-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-49-clear-send-recovery
      - name: Patch clear recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/livecopilot/micprobe/RealtimeTranscriptionClient.java')
          s = p.read_text()

          pattern = re.compile(
              r'        if \(!ready \|\| socket == null \|\| sentSamples < MIN_COMMIT_SAMPLES\) \{\n'
              r'\s+sentSamples = 0;\n'
              r'\s+activeBackup\.clear\(\);\n'
              r'\s+sendClearLocked\(\);\n'
              r'\s+return false;\n'
              r'\s+\}'
          )
          replacement = '''        if (!ready || socket == null || sentSamples < MIN_COMMIT_SAMPLES) {
              WebSocket failedSocket = null;
              boolean clearFailed = ready && socket != null && !sendClearLocked();
              sentSamples = 0;
              activeBackup.clear();
              partial.setLength(0);
              listener.onPartial("");
              if (clearFailed) {
                  failedSocket = socket;
                  socket = null;
                  ready = false;
                  awaitingCompletion = false;
                  listener.onState("fallback");
                  try { failedSocket.close(1011, "clear_failed"); } catch (Throwable ignored) {}
                  scheduleReconnect();
              }
              return false;
          }'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'commit guard mismatch: {n}')

          pattern = re.compile(
              r'    private synchronized void sendClearLocked\(\) \{\n'
              r'\s+if \(socket == null\) return;\n'
              r'\s+try \{\n'
              r'\s+JSONObject event = new JSONObject\(\);\n'
              r'\s+event\.put\("type", "input_audio_buffer\.clear"\);\n'
              r'\s+socket\.send\(event\.toString\(\)\);\n'
              r'\s+\} catch \(Throwable ignored\) \{\}\n'
              r'\s+\}'
          )
          replacement = '''    private boolean sendClearLocked() {
              if (socket == null) return false;
              try {
                  JSONObject event = new JSONObject();
                  event.put("type", "input_audio_buffer.clear");
                  return socket.send(event.toString());
              } catch (Throwable ignored) {
                  return false;
              }
          }'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'clear helper mismatch: {n}')
          p.write_text(s)

          g = Path('app/build.gradle.kts')
          t = g.read_text()
          if t.count('versionCode = 49') != 1 or t.count('versionName = "0.48.0-contiguous-fallback-audio"') != 1:
              raise SystemExit('version mismatch')
          t = t.replace('versionCode = 49', 'versionCode = 50', 1)
          t = t.replace('versionName = "0.48.0-contiguous-fallback-audio"', 'versionName = "0.49.0-clear-send-recovery"', 1)
          g.write_text(t)
          PY
      - name: Commit source changes
        run: |
          git config user.name "opsa1895-gif"
          git config user.email "opsa1895@gmail.com"
          git add app/build.gradle.kts app/src/main/java/com/livecopilot/micprobe/RealtimeTranscriptionClient.java
          git diff --cached --quiet && exit 1
          git commit -m "fix: recover when realtime clear send fails"
          git push origin HEAD:copilot-v0-49-clear-send-recovery
