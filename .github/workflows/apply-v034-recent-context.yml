name: Apply v0.34 recent context

on:
  push:
    branches: [copilot-v0-34-recent-context]
    paths:
      - .github/workflows/apply-v034-recent-context.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-34-recent-context
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python .github/scripts/apply_v034.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/livecopilot/micprobe/MicProbeAccessibilityService.java app/build.gradle.kts
          git diff --cached --check
          git commit -m "v0.34: prioritize recent semantic context [v034-applied]"
          git push origin HEAD:copilot-v0-34-recent-context
