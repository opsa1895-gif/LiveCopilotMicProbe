name: Validate v0.99 transition confirmation reliability

on:
  push:
    branches: [ v0-99-transition-confirmation-reliability ]
    paths:
      - '.validation/v0-99-trigger'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: v0-99-transition-confirmation-reliability
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Apply v0.99 patch
        run: |
          python scripts/apply_v0_99.py
          python scripts/fix_v0_99_tests.py

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit validated app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
            app/src/main/java/com/livecopilot/micprobe/RouteReleaseOutcomeStats.java \
            app/src/test/java/com/livecopilot/micprobe/RouteReleaseTransitionConfirmationRateTest.java \
            app/src/test/java/com/livecopilot/micprobe/RouteReleaseTransitionConfirmationReliabilityTest.java
          git diff --cached --check
          git commit -m "Add transition confirmation reliability labels"
          git push origin HEAD:v0-99-transition-confirmation-reliability
