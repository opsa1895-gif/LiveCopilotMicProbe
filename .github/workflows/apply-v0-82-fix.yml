name: Validate v0.82 route flap damping

on:
  push:
    branches: [ v0-82-route-flap-damping ]
    paths:
      - .github/workflows/apply-v0-82-fix.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Apply v0.82 patch
        run: python3 scripts/apply_v0_82.py

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
            app/src/main/java/com/livecopilot/micprobe/RealtimeRoutingPolicy.java \
            app/src/main/java/com/livecopilot/micprobe/RealtimeTranscriptionClient.java \
            app/src/test/java/com/livecopilot/micprobe/RealtimeRoutingFlapDampingPolicyTest.java
          git commit -m "Damp repeated latency route flips"
          git push origin HEAD:${GITHUB_REF_NAME}
