name: Validate v0.68 adaptive STT routing

on:
  push:
    branches:
      - v0-68-adaptive-stt-routing
    paths:
      - '.ci/v0_68_adaptive_stt_routing.py'
      - '.github/workflows/v0-68-adaptive-stt-routing.yml'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: v0-68-adaptive-stt-routing
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          cache-read-only: true

      - name: Apply v0.68 source patch
        run: python3 .ci/v0_68_adaptive_stt_routing.py

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Remove validation helpers
        run: rm -f .github/workflows/v0-68-adaptive-stt-routing.yml .ci/v0_68_adaptive_stt_routing.py

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/v0-68-adaptive-stt-routing.yml .ci/v0_68_adaptive_stt_routing.py
          git diff --cached --quiet && exit 0
          git commit -m "Live Copilot v0.68 adaptive STT routing"
          git push origin HEAD:v0-68-adaptive-stt-routing
