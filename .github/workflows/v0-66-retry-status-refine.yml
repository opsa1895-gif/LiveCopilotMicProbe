name: Validate v0.66 retry and status refinement

on:
  push:
    branches: [ v0-66-degraded-recovery-state ]
    paths:
      - '.github/workflows/v0-66-retry-status-refine.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: v0-66-degraded-recovery-state
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Apply v0.66 refinement
        run: python3 .ci/v0_66_refine.py

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Remove validation helpers
        run: rm -f .ci/v0_66_refine.py .github/workflows/v0-66-retry-status-refine.yml

      - name: Commit refinement
        run: |
          git config user.name "opsa1895-gif"
          git config user.email "opsa1895@gmail.com"
          git add app .ci/v0_66_refine.py .github/workflows/v0-66-retry-status-refine.yml
          git commit -m "v0.66 refine transient retry and degraded status"
          git push origin HEAD:v0-66-degraded-recovery-state
