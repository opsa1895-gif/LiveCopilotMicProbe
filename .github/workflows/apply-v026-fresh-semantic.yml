name: Apply v0.26 fresh semantic scheduling

on:
  push:
    branches: [copilot-v0-26-fresh-semantic]
    paths:
      - .github/workflows/apply-v026-fresh-semantic.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-26-fresh-semantic
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python .github/scripts/apply_v026.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/livecopilot/micprobe/SemanticReplyFallback.java \
                  app/src/main/java/com/livecopilot/micprobe/MicProbeAccessibilityService.java \
                  app/build.gradle.kts
          git diff --cached --check
          git commit -m "v0.26: keep semantic decisions fresh [v026-applied]"
          git push origin HEAD:copilot-v0-26-fresh-semantic
