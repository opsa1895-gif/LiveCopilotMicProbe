name: Apply v0.22 latest-primary integration

on:
  push:
    branches: [copilot-v0-22-latest-primary]
    paths:
      - .github/workflows/apply-v022-latest-primary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-22-latest-primary
          fetch-depth: 0

      - name: Apply guarded source patch
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, got {count} for {old[:100]!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          client = 'app/src/main/java/com/livecopilot/micprobe/OpenAiCopilotClient.java'
          gradle = 'app/build.gradle.kts'

          replace_exact(client,
              '    private final ExecutorService replyExecutor = Executors.newSingleThreadExecutor();\n',
              '    private final LatestWinsExecutor replyExecutor = new LatestWinsExecutor(2);\n')

          old_queue = (
              '    private void queueReply(String focus, boolean engagement) {\n'
              '        synchronized (this) {\n'
              '            long serial = ++latestReplySerial;\n'
              '            pendingReply = new ReplyJob(serial, sessionSerial, contextTextLocked(), focus, lastDirectReply, engagement);\n'
              '            if (replyWorkerRunning) return;\n'
              '            replyWorkerRunning = true;\n'
              '        }\n'
              '        replyExecutor.execute(this::drainReplies);\n'
              '    }\n\n'
              '    private void drainReplies() {\n'
              '        while (true) {\n'
              '            ReplyJob job;\n'
              '            synchronized (this) {\n'
              '                job = pendingReply;\n'
              '                pendingReply = null;\n'
              '                if (job == null || closed) {\n'
              '                    replyWorkerRunning = false;\n'
              '                    return;\n'
              '                }\n'
              '            }\n'
              '            processReply(job);\n'
              '        }\n'
              '    }\n'
          )
          new_queue = (
              '    private void queueReply(String focus, boolean engagement) {\n'
              '        ReplyJob job;\n'
              '        synchronized (this) {\n'
              '            long serial = ++latestReplySerial;\n'
              '            job = new ReplyJob(serial, sessionSerial, contextTextLocked(), focus, lastDirectReply, engagement);\n'
              '        }\n'
              '        replyExecutor.execute(() -> processReply(job));\n'
              '    }\n'
          )
          replace_exact(client, old_queue, new_queue)

          replace_exact(client, '    private boolean replyWorkerRunning;\n', '')
          replace_exact(client, '    private ReplyJob pendingReply;\n', '')
          replace_exact(client, '        pendingReply = null;\n', '', expected=3)

          replace_exact(gradle,
              '        versionCode = 21\n        versionName = "0.21.0-self-echo"\n',
              '        versionCode = 22\n        versionName = "0.22.0-latest-primary"\n')

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/livecopilot/micprobe/OpenAiCopilotClient.java app/build.gradle.kts
          git diff --cached --check
          git commit -m "v0.22: use latest-wins primary scheduling [v022-applied]"
          git push origin HEAD:copilot-v0-22-latest-primary
