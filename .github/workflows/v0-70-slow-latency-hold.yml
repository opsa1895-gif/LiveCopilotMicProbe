name: Validate v0.70 slow-latency hold

on:
  push:
    branches:
      - v0-70-routing-health-decay
    paths:
      - .github/workflows/v0-70-slow-latency-hold.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Apply slow-latency hold refinement
        run: python .ci/refine_v070_slow_hold.py

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Remove validation helpers
        run: rm -f .ci/refine_v070_slow_hold.py .github/workflows/v0-70-slow-latency-hold.yml

      - name: Commit validated refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app .ci .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "Keep v0.70 quarantine on sustained slow Realtime"
          git push origin HEAD
