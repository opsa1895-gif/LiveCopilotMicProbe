name: Validate v0.65 semantic race refinement

on:
  push:
    branches:
      - v0-65-semantic-lifecycle-retry
    paths:
      - .github/workflows/v0-65-semantic-race-refine.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: v0-65-semantic-lifecycle-retry
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          cache-read-only: true

      - name: Apply semantic race refinement
        run: python3 .github/scripts/v065_refine.py

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Remove validation helpers
        run: |
          rm -f .github/scripts/v065_refine.py \
                .github/workflows/v0-65-semantic-race-refine.yml

      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/livecopilot/micprobe/MicProbeAccessibilityService.java \
                  .github/scripts/v065_refine.py \
                  .github/workflows/v0-65-semantic-race-refine.yml
          git status --short
          git commit -m "v0.65 serialize semantic request apply and pause state"
          git push origin HEAD:v0-65-semantic-lifecycle-retry
