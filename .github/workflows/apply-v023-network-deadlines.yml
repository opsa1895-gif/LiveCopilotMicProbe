name: Apply v0.23 network deadlines

on:
  push:
    branches: [copilot-v0-23-network-deadlines]
    paths:
      - .github/workflows/apply-v023-network-deadlines.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-23-network-deadlines
          fetch-depth: 0

      - name: Apply guarded source patch
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, got {count} for {old[:100]!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          client = 'app/src/main/java/com/livecopilot/micprobe/OpenAiCopilotClient.java'
          gradle = 'app/build.gradle.kts'

          replace_exact(client,
              '    private static final long SELF_ECHO_WINDOW_MS = 12_000L;\n',
              '    private static final long SELF_ECHO_WINDOW_MS = 12_000L;\n'
              '    private static final int PRIMARY_CONNECT_TIMEOUT_MS = 5_000;\n'
              '    private static final int PRIMARY_READ_TIMEOUT_MS = 8_000;\n'
              '    private static final int STYLE_CONNECT_TIMEOUT_MS = 8_000;\n'
              '    private static final int STYLE_READ_TIMEOUT_MS = 18_000;\n')

          replace_exact(client,
              '        HttpResult r = responses(key, request(system, user, 90));\n',
              '        HttpResult r = responses(key, request(system, user, 90),\n'
              '                PRIMARY_CONNECT_TIMEOUT_MS, PRIMARY_READ_TIMEOUT_MS, 1);\n')

          replace_exact(client,
              '        HttpResult r = responses(key, request(system, user, 250));\n',
              '        HttpResult r = responses(key, request(system, user, 250),\n'
              '                STYLE_CONNECT_TIMEOUT_MS, STYLE_READ_TIMEOUT_MS, 1);\n')

          old_method = (
              '    private HttpResult responses(String key, JSONObject req) throws Exception {\n'
              '        Exception last = null;\n'
              '        for (int attempt = 0; attempt < 2; attempt++) {\n'
              '            try {\n'
              '                HttpURLConnection c = connection("https://api.openai.com/v1/responses", key, 35_000);\n'
              '                c.setRequestProperty("Content-Type", "application/json; charset=utf-8");\n'
              '                c.getOutputStream().write(req.toString().getBytes(StandardCharsets.UTF_8));\n'
              '                int code = c.getResponseCode();\n'
              '                String body = read(c, code);\n'
              '                if ((code == 429 || code >= 500) && attempt == 0) {\n'
              '                    Thread.sleep(450L);\n'
              '                    continue;\n'
              '                }\n'
              '                return new HttpResult(code, body);\n'
              '            } catch (Exception e) {\n'
              '                last = e;\n'
              '                if (attempt == 0) Thread.sleep(450L);\n'
              '            }\n'
              '        }\n'
              '        throw last == null ? new IllegalStateException("responses") : last;\n'
              '    }\n'
          )
          new_method = (
              '    private HttpResult responses(String key, JSONObject req, int connectTimeoutMs,\n'
              '                                 int readTimeoutMs, int maxAttempts) throws Exception {\n'
              '        int attempts = Math.max(1, maxAttempts);\n'
              '        Exception last = null;\n'
              '        for (int attempt = 0; attempt < attempts; attempt++) {\n'
              '            try {\n'
              '                HttpURLConnection c = connection("https://api.openai.com/v1/responses", key, readTimeoutMs);\n'
              '                c.setConnectTimeout(Math.max(1_000, connectTimeoutMs));\n'
              '                c.setRequestProperty("Content-Type", "application/json; charset=utf-8");\n'
              '                c.getOutputStream().write(req.toString().getBytes(StandardCharsets.UTF_8));\n'
              '                int code = c.getResponseCode();\n'
              '                String body = read(c, code);\n'
              '                boolean retryable = code == 429 || code >= 500;\n'
              '                if (retryable && attempt + 1 < attempts) {\n'
              '                    Thread.sleep(350L);\n'
              '                    continue;\n'
              '                }\n'
              '                return new HttpResult(code, body);\n'
              '            } catch (Exception e) {\n'
              '                last = e;\n'
              '                if (attempt + 1 < attempts) Thread.sleep(350L);\n'
              '            }\n'
              '        }\n'
              '        throw last == null ? new IllegalStateException("responses") : last;\n'
              '    }\n'
          )
          replace_exact(client, old_method, new_method)

          replace_exact(gradle,
              '        versionCode = 22\n        versionName = "0.22.0-latest-primary"\n',
              '        versionCode = 23\n        versionName = "0.23.0-network-deadlines"\n')

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/livecopilot/micprobe/OpenAiCopilotClient.java app/build.gradle.kts
          git diff --cached --check
          git commit -m "v0.23: bound primary reply network deadlines [v023-applied]"
          git push origin HEAD:copilot-v0-23-network-deadlines
