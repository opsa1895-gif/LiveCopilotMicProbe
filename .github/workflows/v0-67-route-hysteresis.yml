name: Validate v0.67 realtime route hysteresis

on:
  push:
    branches:
      - v0-67-realtime-route-hysteresis
    paths:
      - '.ci/v0_67_route_hysteresis.py'
      - '.github/workflows/v0-67-route-hysteresis.yml'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: v0-67-realtime-route-hysteresis
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          cache-read-only: true

      - name: Apply v0.67 source patch
        run: python3 .ci/v0_67_route_hysteresis.py

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Remove validation helpers
        run: rm -f .github/workflows/v0-67-route-hysteresis.yml .ci/v0_67_route_hysteresis.py

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/v0-67-route-hysteresis.yml .ci/v0_67_route_hysteresis.py
          git diff --cached --quiet && exit 0
          git commit -m "Live Copilot v0.67 realtime route hysteresis"
          git push origin HEAD:v0-67-realtime-route-hysteresis
