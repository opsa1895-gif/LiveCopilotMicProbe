name: Apply v0.44 newest STT context

on:
  push:
    branches: [copilot-v0-44-newest-stt-context]
    paths:
      - .github/workflows/apply-v044-newest-stt-context.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-44-newest-stt-context
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python .github/scripts/apply_v044.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/livecopilot/micprobe/RealtimeTranscriptionClient.java app/build.gradle.kts
          git diff --cached --check
          git commit -m "v0.44: prioritize newest STT prompt context [v044-applied]"
          git push origin HEAD:copilot-v0-44-newest-stt-context
