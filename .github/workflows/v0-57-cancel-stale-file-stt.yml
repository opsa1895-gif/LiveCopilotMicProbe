name: Apply v0.57 stale file STT cancellation

on:
  push:
    branches: [v0-57-cancel-stale-file-stt]
    paths:
      - .github/workflows/v0-57-cancel-stale-file-stt.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0-57-cancel-stale-file-stt
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Apply v0.57 patch
        run: python3 .ci/apply_v057.py

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Remove validation helpers
        run: rm .github/workflows/v0-57-cancel-stale-file-stt.yml .ci/apply_v057.py

      - name: Commit patch
        run: |
          git config user.name "opsa1895-gif"
          git config user.email "opsa1895@gmail.com"
          git add app .github/workflows/v0-57-cancel-stale-file-stt.yml .ci/apply_v057.py
          git commit -m "Live Copilot v0.57 cancel stale file STT"
          git push origin HEAD:v0-57-cancel-stale-file-stt
