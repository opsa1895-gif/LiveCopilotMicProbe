name: Clean v0.52 build artifacts

on:
  push:
    branches: [ v0-52-file-callback-freshness ]
    paths:
      - '.github/workflows/v0-52-clean-build-artifacts.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0-52-file-callback-freshness

      - name: Remove generated files and add ignore rules
        run: |
          git rm -r .gradle app/build
          cat > .gitignore <<'EOF'
          .gradle/
          **/build/
          .idea/
          local.properties
          *.iml
          EOF
          rm .github/workflows/v0-52-clean-build-artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: ignore generated Android build artifacts"
          git push origin HEAD:v0-52-file-callback-freshness
