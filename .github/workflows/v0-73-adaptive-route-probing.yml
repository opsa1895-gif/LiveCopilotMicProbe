name: Validate v0.73 adaptive route probing

on:
  push:
    branches: [ v0-73-adaptive-route-probing ]
    paths:
      - '.github/workflows/v0-73-adaptive-route-probing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: v0-73-adaptive-route-probing
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Apply v0.73 source patch
        run: python3 .github/scripts/v073_patch.py

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Remove validation helpers
        run: rm -f .github/scripts/v073_patch.py .github/workflows/v0-73-adaptive-route-probing.yml

      - name: Commit validated patch
        run: |
          git config user.name "opsa1895-gif"
          git config user.email "opsa1895@gmail.com"
          git add -A
          git commit -m "Live Copilot v0.73 adaptive route probing"
          git push origin HEAD:v0-73-adaptive-route-probing
