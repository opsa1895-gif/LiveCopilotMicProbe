name: Apply v0.35 adaptive endpointing

on:
  push:
    branches: [copilot-v0-35-adaptive-endpointing]
    paths:
      - .github/workflows/apply-v035-adaptive-endpointing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-v0-35-adaptive-endpointing
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python .github/scripts/apply_v035.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/livecopilot/micprobe/SpeechTurnPolicy.java app/src/main/java/com/livecopilot/micprobe/MicProbeEngine.java app/src/test/java/com/livecopilot/micprobe/SpeechTurnPolicyTest.java app/build.gradle.kts
          git diff --cached --check
          git commit -m "v0.35: adaptive speech endpointing [v035-applied]"
          git push origin HEAD:copilot-v0-35-adaptive-endpointing
