name: Validate v0.61 ordered parallel file STT final

on:
  push:
    branches: [v0-61-parallel-file-stt]
    paths:
      - '.github/workflows/v0-61-parallel-file-stt-4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0-61-parallel-file-stt
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Apply v0.61 source patch
        run: |
          python3 .github/scripts/fix_v061_patch.py
          python3 .github/scripts/v061_patch.py
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Remove validation helpers
        run: |
          rm -f .github/workflows/v0-61-parallel-file-stt.yml
          rm -f .github/workflows/v0-61-parallel-file-stt-2.yml
          rm -f .github/workflows/v0-61-parallel-file-stt-3.yml
          rm -f .github/workflows/v0-61-parallel-file-stt-4.yml
          rm -f .github/scripts/v061_patch.py
          rm -f .github/scripts/fix_v061_patch.py
      - name: Commit validated patch
        run: |
          git config user.name "opsa1895-gif"
          git config user.email "opsa1895@gmail.com"
          git add -A
          git commit -m "Live Copilot v0.61 parallelize file STT"
          git push origin HEAD:v0-61-parallel-file-stt
